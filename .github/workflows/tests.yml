#
# Runs the unittest suite, GUI tests offscreen, on the oldest and the newest supported Python.

name: Tests

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.15']
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install PREP-IC
        run: |
          python -m pip install --upgrade pip
          pip install .

      # The GUI tests skip on an ImportError, so a Qt or GUI module that cannot load must fail here.
      - name: Check that the GUI loads
        run: python -c "from PySide6.QtWidgets import QApplication; app = QApplication([]); import prep_ic.gui.main_window"

      - name: Run tests
        run: python -m unittest discover -s tests -t .
