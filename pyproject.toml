[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chiptile"
dynamic = ["version"]
description = "Plan IC pad ring pinouts with live die sizing, RF/GSG pad groups and exports."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Maximilian Golser" }]
dependencies = ["PySide6"]

[project.scripts]
chiptile = "chiptile.cli:main"

[tool.setuptools.dynamic]
version = { attr = "chiptile.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chiptile = ["data/*.json", "data/pdks/*.json"]
