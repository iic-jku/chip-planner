[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prep-ic"
dynamic = ["version"]
description = "PREP-IC (Pinout, Ring and Early floorplan Planner for ICs): plan IC pad ring pinouts with live die sizing, RF/GSG pad groups and exports."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Maximilian Golser", email = "maximilian.golser@jku.at" },
    { name = "Simon Dorrer", email = "simon.dorrer@jku.at" },
]
dependencies = ["PySide6-Essentials>=6.6"]

[project.scripts]
prep-ic = "prep_ic.cli:main"

[tool.setuptools.dynamic]
version = { attr = "prep_ic.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prep_ic = ["data/*.json", "data/pdks/*.json", "gui/assets/*.svg"]
