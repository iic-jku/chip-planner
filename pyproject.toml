[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chip-planner"
dynamic = ["version"]
description = "Plan IC pad ring pinouts with live die sizing, RF/GSG pad groups and exports."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Maximilian Golser" }]
dependencies = ["PySide6-Essentials>=6.6"]

[project.scripts]
chip-planner = "chip_planner.cli:main"

[tool.setuptools.dynamic]
version = { attr = "chip_planner.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chip_planner = ["data/*.json", "data/pdks/*.json", "gui/assets/*.svg"]
